name: Angular Signals Map Join

on:
  pull_request:
    paths:
      - 'examples/angular-signals-map-join/**'
      - '.github/workflows/angular-signals-map-join.yml'
  push:
    branches:
      - master
    paths:
      - 'examples/angular-signals-map-join/**'
      - '.github/workflows/angular-signals-map-join.yml'

jobs:
  validate-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/angular-signals-map-join

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-signals-map-join-test-output
          path: examples/angular-signals-map-join/test-output.log
          if-no-files-found: error

      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build application
        run: npm run build
